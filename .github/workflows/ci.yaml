name: CI

# Pull-request gate. Nothing runs on a plain push.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits through the API
    uses: platform-boutique/platform-demo-workflows/.github/workflows/secret-scan.yaml@a277aeb9226f9b2905cbf9d77626f69bd770f486 # v3.7.0

  workflows:
    permissions:
      contents: read
    uses: platform-boutique/platform-demo-workflows/.github/workflows/workflow-lint.yaml@a277aeb9226f9b2905cbf9d77626f69bd770f486 # v3.7.0

name: CI

# Pull-request gate. Nothing runs on a plain push.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits through the API
    uses: platform-boutique/platform-demo-workflows/.github/workflows/secret-scan.yaml@9e7a60340fa0720de3fdd72147342e9f5abcbbd3 # v3.6.0

  workflows:
    permissions:
      contents: read
    uses: platform-boutique/platform-demo-workflows/.github/workflows/workflow-lint.yaml@9e7a60340fa0720de3fdd72147342e9f5abcbbd3 # v3.6.0
